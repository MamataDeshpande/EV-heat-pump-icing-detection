[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-heat-pump-icing-detection-demo"
version = "0.1.0"
description = "Educational XGBoost icing detection demonstration using synthetic signals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Mamata Deshpande"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
mf4 = ["asammdf>=8,<9"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
